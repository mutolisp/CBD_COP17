<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COP17 文件對照</title>
<meta name="description" content="CBD COP17 會議文件英文原文與正體中文翻譯對照檢閱（非官方翻譯）">
<style>
:root{--bg:#f7f7f4;--panel:#fff;--ink:#1d2321;--muted:#5d6763;--line:#dfe3df;--accent:#1f6f5c;--accent-ink:#fff;--soft:#e8f2ee;--warn:#9a5b00;--warn-bg:#fff4e0;--edit:#fff8d6;--edit-line:#e2c64a;--hl:#fff176;--hl-soft:#fffbd1;--term:#c2185b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--panel:#1a201e;--ink:#e3e8e5;--muted:#9aa5a0;--line:#2c3532;--accent:#5cc2a4;--accent-ink:#0d1412;--soft:#1f2e29;--warn:#f0b35a;--warn-bg:#2e2412;--edit:#2f2a12;--edit-line:#8a7520;--hl:#5c5310;--hl-soft:#2e2b14;--term:#ff8fbf}}
:root[data-theme="dark"]{--bg:#121615;--panel:#1a201e;--ink:#e3e8e5;--muted:#9aa5a0;--line:#2c3532;--accent:#5cc2a4;--accent-ink:#0d1412;--soft:#1f2e29;--warn:#f0b35a;--warn-bg:#2e2412;--edit:#2f2a12;--edit-line:#8a7520;--hl:#5c5310;--hl-soft:#2e2b14;--term:#ff8fbf}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
header.top h1{font-size:16px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.count{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:11px;background:var(--warn);color:var(--panel);font-size:12px;line-height:22px;text-align:center}
.wrap{display:grid;grid-template-columns:340px 1fr;height:calc(100% - 57px);transition:grid-template-columns .2s}
body.side-off .wrap{grid-template-columns:0 1fr}
body.side-off aside{visibility:hidden;border-right:0}
.side{min-width:44px;padding:0 10px}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.filters{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.filters input{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;min-height:56px}
.item:hover{background:var(--soft)}
.item.on{background:var(--soft);box-shadow:inset 3px 0 var(--accent)}
.item .sym{font-size:12px;color:var(--muted)}
.item .t{display:block;font-weight:600;font-size:14px}
.item .e{display:block;font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:1px}
main{overflow:auto;min-width:0}
.doc{max-width:1400px;margin:0 auto;padding:16px}
.empty{padding:48px 16px;color:var(--muted);text-align:center}
.dhead h2{font-size:20px;margin:4px 0}
.dhead .en{color:var(--muted);margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:var(--panel)}
.note{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin:8px 0}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
section.card h3{font-size:15px;margin:0 0 6px}
.sumf{position:relative;border-radius:6px;padding:4px 6px;margin:0 -6px;cursor:pointer}
.sumf:hover{background:var(--soft)}
.sumf.edited{background:var(--edit);outline:1px solid var(--edit-line)}
.sumf ul{margin:4px 0;padding-left:20px}
.label{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:40px;padding:0 12px;border:0;background:var(--panel)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.page .pno{grid-column:1/-1;font-size:12px;color:var(--muted);padding:4px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.enp{padding:8px 12px;border-right:1px solid var(--line);min-width:0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.ep{border-radius:6px;padding:2px 6px;margin:0 -6px 4px;transition:background .15s}
.ep.tb{font:12px/1.45 var(--mono);white-space:pre;overflow-x:auto;overflow-wrap:normal}
.ep.hl-soft,.blk.hl-soft{background:var(--hl-soft)}
.ep.hl,.blk.hl,.blk.hl:hover{background:var(--hl)}
.editor.hl{box-shadow:0 0 0 3px var(--hl)}
mark.term{background:none;color:var(--term);font-weight:700;text-decoration:underline 2px;text-underline-offset:3px}
a.dec{text-decoration:underline 1px dashed;text-underline-offset:3px;white-space:nowrap}
a.dec::after{content:"↗";font-size:.75em;margin-left:1px}
.cv{text-decoration:underline 1px var(--accent);text-underline-offset:3px;cursor:help}
body.cv-off .cv{text-decoration:none;cursor:inherit}
#tip{position:fixed;z-index:10;max-width:min(360px,calc(100% - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;display:none}
#tip.on{display:block}
#tip small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9;display:none}
#toast.on{display:block}
.zh{padding:8px 12px;min-width:0}
.blk{position:relative;border-radius:6px;padding:4px 6px;margin:2px -6px;cursor:pointer;overflow-x:auto}
.blk:hover{background:var(--soft)}
.blk p{margin:.3em 0}
.blk table{border-collapse:collapse;font-size:13px}
.blk td,.blk th{border:1px solid var(--line);padding:2px 6px}
.blk td:first-child,.blk th:first-child{white-space:nowrap}
.blk.edited{background:var(--edit);outline:1px solid var(--edit-line);white-space:pre-wrap}
.badge{position:absolute;top:2px;right:4px;font-size:11px;color:var(--warn)}
.editor{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px;margin:4px -6px;cursor:auto}
.editor textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);resize:vertical}
.editor input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg);margin-top:6px}
.editor .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.editor .orig{font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:8em;overflow:auto;border-left:3px solid var(--line);padding-left:8px;margin-bottom:6px}
body.v-en .page{grid-template-columns:1fr}body.v-en .zh{display:none}body.v-en .enp{border-right:0}
body.v-zh .page{grid-template-columns:1fr}body.v-zh .enp{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(760px,calc(100% - 32px));max-height:calc(100% - 64px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:16px;display:grid;gap:10px}
.dlg h3{margin:0}
.pend{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.pend .old{color:var(--muted);text-decoration:line-through;white-space:pre-wrap}
.pend .new{white-space:pre-wrap}
.pend .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.knav{display:block;margin:0 16px 0;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--soft);font-size:14px;line-height:1.4}
.knav b{color:var(--accent)}
.knav.on{background:var(--accent);color:var(--accent-ink)}.knav.on b{color:inherit}
.kidx{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.kidx a{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);text-decoration:none;font-size:13px}
.kgrp{font-size:16px;margin:24px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--accent)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0;scroll-margin-top:12px}
.kcard h3{margin:0 0 8px;font-size:16px}
.kcard h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.kpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.kpair p{margin:.3em 0}
.ken{font-size:14px;line-height:1.6}
.kexp{background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:14px}
.kfn{font-size:12px;color:var(--muted);margin-top:6px}
.kind ul,.kdocs ul{margin:4px 0;padding-left:20px;font-size:13px}
.kind,.kdocs{margin-top:10px}
.kdocs summary{cursor:pointer;font-size:13px;color:var(--accent);min-height:32px;display:flex;align-items:center}
.kdocs li{margin:2px 0}
.kdocs .pg{display:inline-block;font-size:12px;padding:0 6px;margin:0 2px;border:1px solid var(--line);border-radius:4px;text-decoration:none}
a.kg{text-decoration:underline 1px dotted;text-underline-offset:3px}

/* 預算頁：圖表配色（dataviz 參考調色盤，已以本站淺色／深色底驗證） */
:root{--m1:#d9f0a3;--m2:#a1dab4;--m3:#41b6c4;--m4:#2c7fb8;--m5:#253494;--m6:#081d58;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--muted-fill:#b9c0bc;--grid:#e6e9e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m1:#1f3d5c;--m2:#1d6e8f;--m3:#2a9d8f;--m4:#69c27a;--m5:#c4df5a;--m6:#fde725;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--muted-fill:#56605b;--grid:#2c3532}}
:root[data-theme="dark"]{--m1:#1f3d5c;--m2:#1d6e8f;--m3:#2a9d8f;--m4:#69c27a;--m5:#c4df5a;--m6:#fde725;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--muted-fill:#56605b;--grid:#2c3532}
.leaflet-container{font:inherit}.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}.leaflet-bar a:hover{background:var(--soft)}.leaflet-control-attribution{background:color-mix(in oklab,var(--panel) 80%,transparent)!important;color:var(--muted)}.leaflet-control-attribution a{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.ctrl select,.ctrl input{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;max-width:100%;height:auto}
.chart text,.doc svg text{fill:var(--ink);font-size:12px}
.chart .mut,.doc svg .mut{fill:var(--muted)}
.chart .gl,.doc svg .gl{stroke:var(--grid);stroke-width:1}
.doc svg{max-width:100%;height:auto}
.chart .hit:hover,.chart .hit:focus{opacity:.85;outline:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.src{font-size:12px;color:var(--muted);margin-top:6px}
#vtip{position:fixed;z-index:11;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;max-width:280px}
#vtip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
table.dt{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}
table.dt th:first-child,table.dt td:first-child,table.dt th.t,table.dt td.t{text-align:left;white-space:normal}
table.dt td.t{min-width:6em}
table.dt th{cursor:pointer;position:sticky;top:0;background:var(--panel)}
table.dt th[aria-sort]::after{content:" ▾";color:var(--muted)}
table.dt th[aria-sort="ascending"]::after{content:" ▴"}
.dtwrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.up{color:var(--s2)}.down{color:var(--s1)}
footer{font-size:12px;color:var(--muted);padding:16px;border-top:1px solid var(--line);margin-top:24px}
.back{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  aside{display:flex}
  main{display:none}
  body.reading aside{display:none}
  body.reading main{display:block}
  body.reading .back{display:inline-block}
  .side{display:none}
  body.side-off .wrap{grid-template-columns:1fr}
  body.side-off aside{visibility:visible}
  .page{grid-template-columns:1fr}
  .enp{border-right:0;border-bottom:1px solid var(--line)}
  .kpair{grid-template-columns:1fr}
  body.v-en .zh,body.v-zh .enp{display:none}
}
</style>
</head>
<body class="v-both">
<header class="top">
  <button class="btn back" id="back" aria-label="回到清單">‹ 清單</button>
  <button class="btn side" id="side" aria-label="收合文件清單" aria-expanded="true" title="收合／展開文件清單">«</button>
  <h1>COP17 文件對照：英文原文／正體中文</h1>
  <button class="btn" id="pending">待送出修正<span class="count" id="cnt">0</span></button>
</header>
<div class="wrap">
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="搜尋代碼、英文或中文標題" aria-label="搜尋">
      <div class="chips" id="fm"></div>
      <div class="chips" id="ft"></div>
    </div>
    <a class="knav" id="bnav" href="#budget" style="margin-bottom:8px"><b>預算與分攤</b><br>公約與議定書整合預算：資金流向、各國分攤、2019–2028 趨勢、互動表格與 CSV</a>
    <a class="knav" id="knav" href="#kmgbf"><b>KMGBF 目標與說明</b><br>昆明－蒙特婁全球生物多樣性綱要：願景、4 項長期目標、23 項行動目標，與提到各目標的文件</a>
    <div class="list" id="list" style="margin-top:8px"></div>
  </aside>
  <main id="main"><div class="empty">從左側選一份文件開始檢閱。點中文段落即可修正翻譯；滑過或選取中文時，對應的英文會以螢光標示。</div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<div id="vtip" role="tooltip"></div>
<dialog id="dlg"><div class="dlg" id="dlgc"></div></dialog>
<script>
'use strict';
const REPO = 'https://github.com/mutolisp/CBD_COP17';
const KEY = 'cbd-cop17-review-edits-v1';
window.DOCS = {};
const MEET = [['', '全部'], ['COP-17', 'COP 17'], ['CP-MOP-12', 'CP-MOP 12'], ['NP-MOP-06', 'NP-MOP 6']];
const NAT = [['', '全部類型'], ['limited', 'L 文件'], ['crp', 'CRP'], ['non-paper', 'non-paper'], ['official', '會前文件']];
const NATL = Object.fromEntries(NAT);
const S = {m: '', t: '', q: '', id: null};
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
};
const ymd = s => new Date(Date.parse(s) + 4 * 3600e3).toISOString().slice(0, 10);  // 葉里溫時間

let EDITS = {};
let storeOK = true;
try { EDITS = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { storeOK = false; }
function saveEdits() {
  try { localStorage.setItem(KEY, JSON.stringify(EDITS)); storeOK = true; } catch (e) { storeOK = false; }
  $('#cnt').textContent = Object.keys(EDITS).length;
}

function chips(box, opts, key) {
  box.replaceChildren(...opts.map(([v, l]) => el('button', {class: 'chip' + (S[key] === v ? ' on' : ''), onclick: () => { S[key] = v; chips(box, opts, key); renderList(); }}, l)));
}
function renderList() {
  const norm = s => s.toLowerCase().replace(/[.\s]/g, '');  // 代碼有 L.31／L31 兩種寫法
  const q = norm(S.q);
  const rows = IDX.filter(d => (!S.m || d.meeting === S.m) && (!S.t || d.nature === S.t) &&
    (!q || norm(d.sym + d.title + d.title_zh).includes(q)));
  $('#list').replaceChildren(...rows.map(d => el('button', {class: 'item' + (d.id === S.id ? ' on' : ''), onclick: () => { location.hash = d.id; }},
    el('span', {class: 'sym'}, (d.sym || '（無文件代碼）') + '　' + ymd(d.pub)),
    el('span', {class: 'tag'}, NATL[d.nature] || d.nature), d.full ? null : el('span', {class: 'tag'}, '只有摘要'),
    el('span', {class: 't'}, d.title_zh || d.title), el('span', {class: 'e'}, d.title))),
    rows.length ? '' : el('div', {class: 'empty'}, '沒有符合的文件'));
}

function load(id) {
  return new Promise((ok, bad) => {
    if (window.DOCS[id]) return ok(window.DOCS[id]);
    const s = el('script', {src: 'data/' + id + '.js'});
    s.onload = () => window.DOCS[id] ? ok(window.DOCS[id]) : bad();
    s.onerror = bad;
    document.head.append(s);
  });
}

function route() {
  let h = location.hash.slice(1);
  try { h = decodeURIComponent(h); } catch (_) {}  // 網址含不合法的 % 時不要整頁空白
  const [id, sub] = h.split('/');
  $('#bnav').classList.remove('on');
  if (id === 'kmgbf') openKmgbf(sub); else if (id === 'budget') openBudget(h.split('/').slice(1)); else openDoc(id, sub);
}
const toPage = p => { const e = p && document.getElementById('pg-' + p); if (e) e.scrollIntoView(); };
function openDoc(id, p) {
  $('#knav').classList.remove('on');
  const meta = IDX.find(d => d.id === id);
  if (meta && S.id === id && $('#main .page')) { toPage(p); return; }  // 同一份文件只換頁
  S.id = meta ? id : null;
  document.body.classList.toggle('reading', !!meta);
  renderList();

}

function flowAlt(B, k) {

  sh.forEach(r => { nodes.push({id: 'p' + fk(r), col: 0, label: '締約方・' + ({COP: '公約', CP: '卡塔赫納議定書', NP: '名古屋議定書'})[fk(r)], color: FC[fk(r)]}); links.push({s: 'p' + fk(r), t: 'tot', v: r.v[k], color: FC[fk(r)]}); });

  if (host) { nodes.push({id: 'host', col: 0, label: '地主國捐助', color: 'var(--muted-fill)'}); links.push({s: 'host', t: 'tot', v: host, color: 'var(--muted-fill)'}); }
  if (res) { nodes.push({id: 'res', col: 0, label: '動用準備金', color: 'var(--muted-fill)'}); links.push({s: 'res', t: 'tot', v: res, color: 'var(--muted-fill)'}); }

function sankey(nodes, links) {
  links = links.filter(l => l.v > 0.05);
  const W = 880, H = 440, nw = 12, pad = 24, gap = 18, ncol = Math.max(...nodes.map(n => n.col)) + 1;
  const N = Object.fromEntries(nodes.map(n => [n.id, {...n, in: 0, out: 0}]));
  links.forEach(l => { N[l.s].out += l.v; N[l.t].in += l.v; });
  const cols = [...Array(ncol)].map((_, c) => Object.values(N).filter(n => n.col === c && Math.max(n.in, n.out) > 0));
  const scale = Math.min(...cols.map(c => (H - 2 * pad - gap * (c.length - 1)) / c.reduce((s, n) => s + Math.max(n.in, n.out), 0)));
  const x0 = 190, x1 = W - 130, colX = c => x0 + (x1 - x0 - nw) * c / Math.max(1, ncol - 1);
  cols.forEach((c, ci) => {
    const tot = c.reduce((s, n) => s + Math.max(n.in, n.out) * scale, 0) + gap * (c.length - 1);
    let y = (H - tot) / 2;
    c.forEach(n => { n.x = colX(ci); n.y = y; n.h = Math.max(n.in, n.out) * scale; n.oy = y; n.iy = y; y += n.h + gap; });
  });
  const svg = sv('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '資金流向圖'});
  for (const l of links) {
    const a = N[l.s], b = N[l.t], h = l.v * scale, xa = a.x + nw, xb = b.x, xm = (xa + xb) / 2;
    const ya = a.oy, yb = b.iy; a.oy += h; b.iy += h;
    const p = sv('path', {d: `M${xa},${ya}C${xm},${ya} ${xm},${yb} ${xb},${yb}L${xb},${yb + h}C${xm},${yb + h} ${xm},${ya + h} ${xa},${ya + h}Z`,
      fill: l.color, 'fill-opacity': .35, stroke: 'var(--panel)', 'stroke-width': 1});
    tipOn(p, () => [kusd(l.v), a.label + ' → ' + b.label]);
    svg.append(p);
  }
  for (const n of Object.values(N)) {
    if (n.h === undefined) continue;
    const r = sv('rect', {x: n.x, y: n.y, width: nw, height: Math.max(1, n.h), rx: 2, fill: n.color});
    tipOn(r, () => [kusd(Math.max(n.in, n.out)), n.label]);
    const last = n.col === ncol - 1, first = n.col === 0;
    const tx = first ? n.x - 6 : last ? n.x + nw + 6 : n.x + nw + 6;
    const t = sv('text', {x: tx, y: n.y + n.h / 2 - 2, 'text-anchor': first ? 'end' : 'start'}, n.label);
    const v = sv('text', {x: tx, y: n.y + n.h / 2 + 12, 'text-anchor': first ? 'end' : 'start', class: 'mut'}, nf(Math.max(n.in, n.out)));
    svg.append(r, t, v);
  }
  return svg;
}

function tableCard(B) {
  const card = el('section', {class: 'card'}), wrap = el('div', {class: 'dtwrap'});
  const ds = el('select', {'aria-label': '資料表'}, ...B.funds.map(f => el('option', {value: f.key}, f.zh + '分攤表（2027–2028）')),

  const fmtSel = el('select', {'aria-label': '儲存格格式'}, el('option', {value: 'bar'}, '資料條'), el('option', {value: 'heat'}, '色階'), el('option', {value: 'none'}, '無格式'));
  const scaleSel = el('select', {'aria-label': '比例'}, el('option', {value: 'log'}, '對數比例'), el('option', {value: 'lin'}, '線性比例'));
  const src = el('div');
  let cols = [], rows = [], sortK = null, asc = false;
  const build = () => {
    if (B.funds.some(f => f.key === ds.value)) {
      const f = B.funds.find(f => f.key === ds.value), p = B.prev[f.key];
      cols = [['締約方', 't'], ['Party', 't'], ['區域', 't'], ['聯合國比例（%）'], ['調整後比例（%）'], ['2027（美元）'], ['2028（美元）'], ['2027–2028'], ['2025–2026'], ['增減（%）']];
      rows = f.contrib.rows.map(r => { const pv = p?.v[r.key]; return [r.zh, r.en, r.region, r.v[0], r.v[1], r.v[2], r.v[3], r.v[4], pv ?? null, pv ? (r.v[4] / pv - 1) * 100 : null]; });
      src.replaceChildren(srcLine(B, [[f.id, f.pages.ct, f.sym + ' 分攤表'], ...(p ? [[p.url, 0, '決議 ' + p.ref]] : [])]));
    } else {
      const t = ds.value === 'T1' ? B.table1 : B.alt;
      cols = [['項目', 't'], ['Item', 't'], ...t.cols.map(c => [c])];
      rows = t.rows.map(r => [r.zh, r.en, ...r.v]);
      src.replaceChildren(srcLine(B, [[t.id, t.page, ds.value === 'T1' ? 'CBD/COP/17/L.31/Rev.1 表 1' : '表 1.alt']]));
    }
    sortK = null; draw();
  };
  let dec = [];  // 每欄固定小數位數（取該欄原文最多的位數，最多 3 位）
  const decOf = k => Math.min(3, Math.max(0, ...rows.map(r => typeof r[k] === 'number' ? ((String(r[k]).split('.')[1] || '').length) : 0)));
  const view = () => {
    dec = cols.map((_, k) => decOf(k));
    const s = q.value.trim().toLowerCase();
    let r = s ? rows.filter(x => x.some(c => typeof c === 'string' && c.toLowerCase().includes(s))) : rows.slice();
    if (sortK !== null) r.sort((a, b) => { const x = a[sortK], y = b[sortK]; const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'zh-Hant'); return asc ? c : -c; });
    return r;
  };
  const draw = () => {
    const r = view();
    // 各數字欄的範圍（以全部列計算，篩選時比例不變）
    const rng = cols.map((_, k) => { const v = rows.map(x => x[k]).filter(x => typeof x === 'number'); return v.length ? [Math.min(...v), Math.max(...v)] : null; });
    const isChg = k => cols.length === 10 && k === 9;
    const frac = (k, c) => {
      const [lo, hi] = rng[k];
      if (scaleSel.value === 'log' && lo > 0 && hi > lo) return c <= 0 ? 0 : .06 + .94 * Math.log(c / lo) / Math.log(hi / lo);  // 以欄內最小值為起點的對數比例
      if (scaleSel.value === 'log' && lo === 0) { const pos = rows.map(x => x[k]).filter(x => typeof x === 'number' && x > 0), m = Math.min(...pos); return c <= 0 || !pos.length || hi <= m ? 0 : .06 + .94 * Math.log(c / m) / Math.log(hi / m); }
      return hi > lo ? (c - Math.min(0, lo)) / (hi - Math.min(0, lo)) : 0;
    };
    const cellStyle = (k, c) => {
      if (typeof c !== 'number' || !rng[k] || fmtSel.value === 'none') return null;
      if (isChg(k)) {  // 增減：0 在中央，減少向左（藍）、增加向右（橘），以 ±50% 為滿格
        const w = Math.min(50, Math.abs(c)) / 50 * 50;
        const col = c < 0 ? 'var(--s1)' : 'var(--s2)';
        if (fmtSel.value === 'heat') return `background:color-mix(in oklab, ${col} ${Math.round(w * 1.4)}%, transparent)`;
        return c < 0 ? `background:linear-gradient(to right, transparent ${50 - w}%, color-mix(in oklab, ${col} 45%, transparent) ${50 - w}% 50%, transparent 50%)`
          : `background:linear-gradient(to right, transparent 50%, color-mix(in oklab, ${col} 45%, transparent) 50% ${50 + w}%, transparent ${50 + w}%)`;
      }
      const f = Math.max(0, Math.min(1, frac(k, c)));
      if (fmtSel.value === 'heat') return `background:color-mix(in oklab, var(--s1) ${Math.round(8 + f * 62)}%, transparent)`;
      return `background:linear-gradient(to right, color-mix(in oklab, var(--s1) 32%, transparent) ${(f * 100).toFixed(1)}%, transparent ${(f * 100).toFixed(1)}%)`;
    };
    wrap.replaceChildren(el('table', {class: 'dt'},
      el('thead', {}, el('tr', {}, ...cols.map(([c, t], k) => el('th', {class: t || '', 'aria-sort': sortK === k ? (asc ? 'ascending' : 'descending') : null,
        onclick: () => { if (sortK === k) asc = !asc; else { sortK = k; asc = !!t; } draw(); }}, c)))),
      el('tbody', {}, ...r.map(x => el('tr', {}, ...x.map((c, k) => el('td', {class: cols[k][1] || (k === 9 && c !== null ? (c >= 0 ? 'up' : 'down') : ''), style: cellStyle(k, c)},
        typeof c === 'number' ? k === 9 && cols.length === 10 ? (c >= 0 ? '+' : '') + nf(c) : nf(c, dec[k]) : (c ?? '—'))))))));
  };
  exp.addEventListener('click', () => {
    const esc = v => { let t = String(v ?? ''); if (typeof v === 'string' && /^[=+\-@]/.test(t)) t = "'" + t; return '"' + t.replace(/"/g, '""') + '"'; };  // 避免試算表把文字當公式
    const text = '﻿' + [cols.map(c => c[0]), ...view()].map(r => r.map(esc).join(',')).join('\r\n');

    document.body.append(a); a.click(); a.remove();
  });

  fmtSel.addEventListener('change', draw); scaleSel.addEventListener('change', draw);
  card.append(el('h3', {}, '互動表格'), el('div', {class: 'ctrl'}, ds, q, fmtSel, scaleSel, exp), wrap,
    el('p', {class: 'label'}, '點欄名排序；篩選會套用到匯出。增減為 2027–2028 合計與上一期（2025–2026）合計相比。資料條與色階以整欄的最大值為基準（對數比例讓小額也看得出差異；增減以 ±50% 為滿格）。'), src);
  build();
  return card;
}

    el('p', {}, el('a', {href: REPO, target: '_blank', rel: 'noopener'}, 'GitHub repo'), '　·　', el('a', {href: REPO + '/issues', target: '_blank', rel: 'noopener'}, '修正回報（Issues）')));
}

chips($('#fm'), MEET, 'm');
chips($('#ft'), NAT, 't');
$('#q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
$('#pending').addEventListener('click', showPending);
$('#back').addEventListener('click', () => { history.replaceState(null, '', location.pathname + location.search); openDoc(null); });
window.addEventListener('hashchange', route);
saveEdits();
try { if (localStorage.getItem(KEY + '-cv') === 'off') document.body.classList.add('cv-off'); } catch (_) {}
// 桌機版文件清單可收合，記住狀態
function side(off) {
  document.body.classList.toggle('side-off', off);
  $('#side').textContent = off ? '☰ 清單' : '«';
  $('#side').setAttribute('aria-expanded', String(!off));
  $('#side').setAttribute('aria-label', off ? '展開文件清單' : '收合文件清單');
}
try { side(localStorage.getItem(KEY + '-side') === 'off'); } catch (_) {}
$('#side').addEventListener('click', () => {
  const off = !document.body.classList.contains('side-off');
  side(off);
  try { localStorage.setItem(KEY + '-side', off ? 'off' : 'on'); } catch (_) {}
});
// 先載詞彙（固定用語底線要用），再載文件清單
const s = el('script', {src: 'data/index.js'});
s.onload = () => { renderList(); route(); };
s.onerror = () => $('#list').replaceChildren(el('div', {class: 'empty'}, '找不到 data/index.js，請先執行 tools/review_site.py。'));
const tv = el('script', {src: 'data/terms.js'});
tv.onload = tv.onerror = () => document.head.append(el('script', {src: 'data/kmgbf.js', onload: () => document.head.append(s), onerror: () => document.head.append(s)}));
document.head.append(tv);
const tip = $('#tip');
document.addEventListener('mouseover', e => {
  const c = e.target.closest?.('.cv');
  if (!c || document.body.classList.contains('cv-off')) { tip.classList.remove('on'); return; }
  tip.replaceChildren(c.dataset.tip, el('small', {}, c.dataset.kind));
  tip.classList.add('on');
  const r = c.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  tip.style.top = (r.bottom + h + 12 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px';
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocus(); });
</script>
